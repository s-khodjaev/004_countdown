<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/main.css" />
    <title>Coming Soon - Under Construction</title>
  </head>
  <body>
    <div class="grid-container">
      <div class="info">
        <img src="img/logo.png" alt="" class="logo" />
        <h1>We are launching soon!</h1>
        <div id="countdown-clock">
          <div class="time">
            <span class="days">27</span>
            <small>Days</small>
          </div>
          <div class="time">
            <span class="hours">23</span>
            <small>Hours</small>
          </div>
          <div class="time">
            <span class="minutes">36</span>
            <small>Minutes</small>
          </div>
          <div class="time">
            <span class="seconds">59</span>
            <small>Seconds</small>
          </div>
        </div>
        <form id="form">
          <p>Get notified when we launch!</p>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Your email address"
          />
          <button type="button" class="btn">
            <i class="fas fa-envelope"></i>
            <span>Notify Me</span>
          </button>
        </form>
        <div class="social">
          <i class="fab fa-facebook"></i>
          <i class="fab fa-github"></i>
          <i class="fab fa-google-plus-g"></i>
          <i class="fab fa-linkedin"></i>
          <i class="fab fa-twitter"></i>
        </div>
        <footer>
          <p>Copyright &copy; TemplateJungle 2022.</p>
        </footer>
      </div>
      <div class="image">
        <img src="img/sideimg.jpg" alt="" />
      </div>
    </div>
    <script type="text/javascript">
      function getTimeRemaining(endtime) {
        const total = Date.parse(endtime) - Date.parse(new Date());
        const seconds = Math.floor((total / 1000) % 60);
        const minutes = Math.floor((total / 1000 / 60) % 60);
        const hours = Math.floor((total / (1000 * 60 * 60)) % 24);
        const days = Math.floor(total / (1000 * 60 * 60 * 24));

        return {
          total,
          days,
          hours,
          minutes,
          seconds,
        };
      }

      function initializeClock(id, endtime) {
        const clock = document.getElementById(id);
        const daysSpan = clock.querySelector('.days');
        const hoursSpan = clock.querySelector('.hours');
        const minutesSpan = clock.querySelector('.minutes');
        const secondsSpan = clock.querySelector('.seconds');

        function updateClock() {
          const t = getTimeRemaining(endtime);

          daysSpan.innerHTML = t.days;
          hoursSpan.innerHTML = ('0' + t.hours).slice(-2);
          minutesSpan.innerHTML = ('0' + t.minutes).slice(-2);
          secondsSpan.innerHTML = ('0' + t.seconds).slice(-2);

          if (t.total <= 0) {
            clearInterval(timeinterval);
          }
        }

        updateClock();
        const timeinterval = setInterval(updateClock, 1000);
      }

      const deadline = new Date(
        Date.parse(new Date()) + 28 * 24 * 60 * 60 * 1000,
      );
      initializeClock('countdown-clock', deadline);
    </script>
  </body>
</html>
